mongo_uri: "mongodb://127.0.0.1:27017"
mongo_db: "quantaxis_price_data"
parquet_root: "local_data/market"

# 记账标签。文件都在 parquet_root 下，读取不回退到 MongoDB。
collections:
  price_panel: "research_panel.parquet"
  volume_oi_panel: "research_panel.parquet"
  minute_bars: "minute"
  member_position: "member_position.parquet"
  contract_full: "contract_day_full.parquet"
  vendor_main_map: "vendor_main_map.parquet"

protocol:
  # research：后复权 adj_settle 连续记账。account：原始 settle 成交和盯市，换月价差不进盈亏。
  book: account
  signal_price: "adj_close"
  research_execution_price: "adj_settle"
  account_execution_price: "settle"
  account_mark_price: "settle"
  signal_lag: 1
  daily_annualization: 243
  weekly_annualization: 52
  # 样本外是该日及之后的交易日，样本内是更早的交易日。
  oos_start: "2025-01-01"

# 交易所合约代码前缀与品种名不同的历史别名（全合约 CSV 与研究主力中观察到）。
# valid_until 取自 load_data1.csv 中该前缀最后出现的交易日；超过该日期出现别名前缀即报错。
code_prefix_aliases:
  MA:
    - prefix: "me"
      valid_until: "2015-05-15"
  ZC:
    - prefix: "tc"
      valid_until: "2016-04-08"

# 上期所、上期能源、大商所、郑商所自该日起把成交量、成交额、持仓改为单边。
# 日频 Parquet 已按单边入库。5 分钟 Parquet 仍是公布口径，只在读取时把该日之前的双边数值除以 2。
volume_convention:
  single_sided_since: "2020-01-01"
  fields: [volume, amount, oi]
  minute_double_sided_exchanges: [SHF, SHFE, XSGE, DCE, XDCE, ZCE, CZCE, XZCE, INE, XSIE]
  minute_always_single_exchanges: [CFFEX, CFX, CCFX]
